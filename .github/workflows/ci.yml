name: ci

on:
  push:
    branches: [main, framework]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv pip install --system -e ".[torch,jax,builders]"
          uv pip install --system pytest pytest-xdist ruff

      - name: Lint
        run: ruff check src

      - name: Test
        run: pytest -q -n auto

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install core + builders (no torch/jax)
        run: |
          uv pip install --system -e ".[builders]"
          uv pip install --system pytest
      - name: Import purity
        run: |
          python -c "import sys, arrayff, arrayff.potentials; assert 'torch' not in sys.modules and 'jax' not in sys.modules"
      - name: Test without optional backends
        run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: |
          uv pip install --system -e ".[torch,jax,builders]"
          uv pip install --system pytest
      - name: Timing and derivative tables
        run: |
          pytest -s src/tests-benchmark/bench_potentials.py -q
          pytest -s src/tests-benchmark/bench_derivatives.py -q
